<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - snek.page</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <style>
    body {
      max-width: 1000px;
      margin: 0 auto;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 2rem;
      align-items: start;
    }
    .art-wrap {
      position: sticky;
      top: 1rem;
      width: min(380px, 38vw);
      margin: 0;
    }
    @media (max-width: 800px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
      .art-wrap {
        position: static;
        order: -1;
        width: auto;
      }
    }
    h1 {
      margin-bottom: 0.3rem;
    }
    .lead {
      margin-top: 0;
    }
    #path {
      background: var(--code-bg);
      padding: 0.1rem 0.4rem;
      word-break: break-all;
    }
    .art {
      display: block;
      width: 100%;
      height: auto;
    }
    @media (max-width: 800px) {
      .art {
        width: auto;
        max-width: 100%;
        max-height: 45vh;
        margin: 1rem auto 0;
      }
    }
    h3 {
      margin: 2rem 0 0.5rem;
    }
    .sheet {
      width: 100%;
      border-collapse: collapse;
    }
    .sheet th, .sheet td {
      border-bottom: 1px solid var(--border);
      padding: 0.4rem 0.3rem;
      text-align: left;
      vertical-align: top;
    }
    .sheet th {
      width: 9rem;
      font-weight: normal;
      color: var(--muted);
    }
    .params {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.2rem 1rem;
    }
    .params b {
      display: inline-block;
      min-width: 2rem;
    }
    @media (max-width: 480px) {
      .sheet th { width: 6.5rem; }
      .params { grid-template-columns: repeat(2, 1fr); }
    }
    .summon-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    #summon {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font: inherit;
    }
    #summon:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .quartz {
      color: var(--muted);
    }
    .circle {
      display: inline-block;
      width: 1.2rem;
      height: 1.2rem;
      border: 2px dashed var(--text);
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 0.5rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .circle { animation: none; }
    }
    #results {
      list-style: none;
      padding: 0;
      margin: 1rem 0 0;
    }
    #results li {
      padding: 0.3rem 0;
    }
    .stars {
      display: inline-block;
      min-width: 5.5rem;
      letter-spacing: 1px;
    }
    .r5 .stars {
      color: #c9a227;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="toggle theme"></button>
  <div class="back-link"><a href="/">← back</a></div>

  <h1>404</h1>
  <p class="lead">no servant answered the summon for <code id="path"></code></p>

  <div class="layout">
  <main>
  <h3>servant status</h3>
  <table class="sheet">
    <tr><th>class</th><td id="class"></td></tr>
    <tr><th>true name</th><td id="true-name"></td></tr>
    <tr><th>master</th><td>you</td></tr>
    <tr><th>parameters</th><td><div class="params" id="params"></div></td></tr>
    <tr><th>class skill</th><td>presence concealment EX: cannot be found by any means</td></tr>
    <tr><th>noble phantasm</th><td id="np"></td></tr>
  </table>

  <h3>summon</h3>
  <p>spend saint quartz to summon a page that does exist.</p>
  <div class="summon-row">
    <button id="summon">summon (3 quartz)</button>
    <span class="quartz" id="quartz"></span>
  </div>
  <ul id="results"></ul>
  </main>

  <figure class="art-wrap" id="art-wrap">
    <img class="art" src="/img/404.webp" alt="" onerror="document.getElementById('art-wrap').remove()">
  </figure>
  </div>

  <script>
    const path = decodeURIComponent(location.pathname);
    document.getElementById('path').textContent = path;
    document.getElementById('true-name').textContent = path;

    // Stats are seeded by the path, so each missing page is its own servant.
    function mulberry32(seed) {
      return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    let seed = 5381;
    for (const ch of path) seed = (Math.imul(seed, 33) + ch.charCodeAt(0)) | 0;
    const rand = mulberry32(seed);
    const pick = (list) => list[Math.floor(rand() * list.length)];

    const classes = ['saber', 'archer', 'lancer', 'rider', 'caster', 'assassin', 'berserker', 'ruler', 'avenger', 'moon cancer', 'alter ego', 'foreigner', 'pretender', 'shielder'];
    const ranks = ['E', 'D', 'C', 'B', 'A', 'A+', 'EX'];
    const phantasms = [
      'unlimited broken links',
      'gate of nothing',
      'excalibur (not found)',
      'reality marble: empty directory',
      'rho aias of the missing page',
      'gae bolg: the link that was never there',
      'god hand (all twelve lives spent)',
      'enuma elish, but the page is gone',
    ];

    document.getElementById('class').textContent = pick(classes);
    document.getElementById('np').textContent = pick(phantasms);
    const params = [
      ['strength', pick(ranks)],
      ['endurance', pick(ranks)],
      ['agility', pick(ranks)],
      ['mana', pick(ranks)],
      ['luck', 'E-'],
      ['phantasm', pick(ranks)],
    ];
    const paramsEl = document.getElementById('params');
    for (const [name, rank] of params) {
      const span = document.createElement('span');
      span.innerHTML = '<b></b> ';
      span.querySelector('b').textContent = rank;
      span.append(name);
      paramsEl.append(span);
    }

    // Summoning
    const pool = [
      { stars: 5, name: 'film photos', href: '/film.html' },
      { stars: 4, name: 'assisted-by', href: 'https://assisted-by.dev/' },
      { stars: 4, name: 'gitlore', href: 'https://github.com/snek-git/gitlore' },
      { stars: 4, name: 'drift-bench', href: 'https://github.com/snek-git/drift-bench' },
      { stars: 4, name: 'quickshell-toys', href: 'https://github.com/snek-git/quickshell-toys' },
      { stars: 4, name: 'music-craft', href: 'https://music-craft.snek.page/' },
      { stars: 3, name: 'the homepage', href: '/' },
      { stars: 3, name: 'shared files', href: '/share.html' },
      { stars: 3, name: 'craft essence: rss feed', href: '/feed.xml' },
    ];
    const weights = { 5: 1, 4: 3, 3: 6 };
    const totalWeight = pool.reduce((sum, p) => sum + weights[p.stars], 0);

    function roll() {
      let r = Math.random() * totalWeight;
      for (const p of pool) {
        r -= weights[p.stars];
        if (r < 0) return p;
      }
      return pool[pool.length - 1];
    }

    const button = document.getElementById('summon');
    const quartzEl = document.getElementById('quartz');
    const results = document.getElementById('results');
    let quartz = 9;

    function showQuartz() {
      quartzEl.textContent = quartz > 0 ? quartz + ' saint quartz left' : "out of saint quartz. no, you can't buy more.";
      button.disabled = quartz < 3;
    }
    showQuartz();

    button.addEventListener('click', () => {
      quartz -= 3;
      button.disabled = true;
      const li = document.createElement('li');
      li.innerHTML = '<span class="circle"></span>summoning...';
      results.prepend(li);
      setTimeout(() => {
        const p = roll();
        li.className = 'r' + p.stars;
        li.innerHTML = '<span class="stars"></span> <a></a>';
        li.querySelector('.stars').textContent = '★'.repeat(p.stars);
        const a = li.querySelector('a');
        a.href = p.href;
        a.textContent = p.name;
        showQuartz();
      }, 900);
    });
  </script>
</body>
</html>
