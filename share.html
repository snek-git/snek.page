<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>share - snek.page</title>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <style>
    :root {
      --bg: #fff;
      --text: #222;
      --link: #0066cc;
      --visited: #551a8b;
      --border: #ccc;
      --code-bg: #f4f4f4;
      --hover-bg: #f5f5f5;
    }
    :root.dark {
      --bg: #2b2b2b;
      --text: #e0e0e0;
      --link: #8cb4ff;
      --visited: #b8a0d8;
      --border: #555;
      --code-bg: #1a1a1a;
      --hover-bg: #333;
    }
    body { padding: 1rem; max-width: 800px; margin: 0 auto; background: var(--bg); color: var(--text); }
    a { color: var(--link); }
    a:visited { color: var(--visited); }
    .theme-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      font-size: 12px;
      z-index: 10;
    }
    .back-link { margin-bottom: 1rem; }
    .breadcrumbs { margin-bottom: 1rem; font-size: 0.9em; }
    .breadcrumbs a { text-decoration: none; }
    .breadcrumbs .sep { margin: 0 0.3rem; color: var(--text); opacity: 0.5; }
    .file-list { list-style: none; padding: 0; margin: 0; }
    .file-list li { border-bottom: 1px solid var(--border); }
    .file-list li a, .file-list li span.dl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.3rem;
      text-decoration: none;
    }
    .file-list li:hover { background: var(--hover-bg); }
    .file-list .size { color: #888; font-size: 0.85em; margin-left: 1rem; white-space: nowrap; }
    .file-list .name { overflow: hidden; text-overflow: ellipsis; }
    .md-viewer { margin-top: 1rem; line-height: 1.6; }
    .md-viewer pre { background: var(--code-bg); padding: 1rem; overflow-x: auto; }
    .md-viewer code { background: var(--code-bg); padding: 0.2rem 0.4rem; }
    .md-viewer pre code { padding: 0; }
    .md-viewer img { max-width: 100%; }
    .md-viewer blockquote { border-left: 3px solid var(--border); margin-left: 0; padding-left: 1rem; }
    .md-viewer table { border-collapse: collapse; width: 100%; }
    .md-viewer th, .md-viewer td { border: 1px solid var(--border); padding: 0.4rem 0.8rem; text-align: left; }
    .empty { color: #888; font-style: italic; padding: 1rem 0; }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle">dark</button>
  <div class="back-link"><a href="/">&larr; back</a></div>
  <h1>share</h1>
  <div class="breadcrumbs" id="breadcrumbs"></div>
  <div id="content"></div>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    let isDark = localStorage.getItem('theme') === 'dark';
    function applyTheme() {
      document.documentElement.classList.toggle('dark', isDark);
      themeToggle.textContent = isDark ? 'light' : 'dark';
    }
    applyTheme();
    themeToggle.addEventListener('click', () => {
      isDark = !isDark;
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      applyTheme();
    });

    const FILE_TREE = {"name":"share","type":"directory","children":[{"name":"README.md","type":"file","size":121},{"name":"japan-trip.md","type":"file","size":20515},{"name":"notes","type":"directory","children":[{"name":"example.md","type":"file","size":296}]}]};
    const md = window.markdownit({ html: true, linkify: true, breaks: true });
    const content = document.getElementById('content');
    const breadcrumbs = document.getElementById('breadcrumbs');

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function getNode(p) {
      if (!p || p === '/') return FILE_TREE;
      const parts = p.split('/').filter(Boolean);
      let node = FILE_TREE;
      for (const part of parts) {
        if (!node.children) return null;
        node = node.children.find(c => c.name === part);
        if (!node) return null;
      }
      return node;
    }

    function renderBreadcrumbs(p) {
      const parts = p.split('/').filter(Boolean);
      let html = '<a href="#/">share</a>';
      let acc = '';
      for (const part of parts) {
        acc += '/' + part;
        html += '<span class="sep">/</span><a href="#' + acc + '">' + part + '</a>';
      }
      breadcrumbs.innerHTML = html;
    }

    function renderDirectory(node, p) {
      renderBreadcrumbs(p);
      if (!node.children || node.children.length === 0) {
        content.innerHTML = '<p class="empty">empty directory</p>';
        return;
      }
      const sorted = [...node.children].sort((a, b) => {
        if (a.type !== b.type) return a.type === 'directory' ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      let html = '<ul class="file-list">';
      for (const child of sorted) {
        const childPath = (p === '' ? '' : p) + '/' + child.name;
        if (child.type === 'directory') {
          html += '<li><a href="#' + childPath + '"><span class="name">' + child.name + '/</span></a></li>';
        } else if (child.name.endsWith('.md')) {
          html += '<li><a href="#' + childPath + '"><span class="name">' + child.name + '</span><span class="size">' + formatSize(child.size) + '</span></a></li>';
        } else {
          html += '<li><a href="share' + childPath + '"><span class="name">' + child.name + '</span><span class="size">' + formatSize(child.size) + '</span></a></li>';
        }
      }
      html += '</ul>';
      content.innerHTML = html;
    }

    async function renderMarkdown(p) {
      renderBreadcrumbs(p);
      try {
        const resp = await fetch('share' + p);
        const text = await resp.text();
        const cleaned = text.replace(/^---\n[\s\S]*?\n---\n*/, '');
        content.innerHTML = '<div class="md-viewer">' + md.render(cleaned) + '</div>';
      } catch (e) {
        content.innerHTML = '<p>Failed to load file.</p>';
      }
    }

    function navigate() {
      const hash = decodeURIComponent(location.hash.slice(1)) || '/';
      const node = getNode(hash);
      if (!node) {
        content.innerHTML = '<p>Not found.</p>';
        renderBreadcrumbs(hash);
        return;
      }
      if (node.type === 'directory') {
        renderDirectory(node, hash === '/' ? '' : hash);
      } else if (node.name.endsWith('.md')) {
        renderMarkdown(hash);
      } else {
        window.location.href = 'share' + hash;
      }
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  </script>
</body>
</html>
