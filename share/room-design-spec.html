<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technical spec · v0.0.0</title>
<meta name="description" content="Discussion draft: agent flow, technical shape and evals for the room-design app.">
<meta property="og:title" content="Technical spec · v0.0.0"><meta property="og:description" content="Discussion draft. Everything is open to change."><meta property="og:type" content="article">
<style>
:root{color-scheme:light;--paper:#faf9f5;--ink:#252d36;--muted:#616b74;--line:#dce0e3;--blue:#335b8f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 'Segoe UI',sans-serif}main{max-width:980px;margin:auto;padding:30px 48px 60px}nav{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px;font-size:12px;color:var(--muted)}nav div{display:flex;gap:18px}a{color:var(--blue);text-underline-offset:4px}button{font:inherit;background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:4px}h1{font-size:38px;line-height:1.2;letter-spacing:-1.2px;margin:34px 0 12px}h1+p{color:var(--muted);margin-bottom:30px}h2{font-size:23px;letter-spacing:-.4px;line-height:1.3;margin:36px 0 16px}p{margin:14px 0}li{margin:7px 0}ul{padding-left:22px}strong{font-weight:650}table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:600}th,td{border-bottom:1px solid var(--line);padding:12px 14px;vertical-align:top}td:first-child{width:160px;font-weight:600}th:first-child,td:first-child{padding-left:0}pre{background:#efefea;padding:18px 20px;overflow:auto;border-radius:4px;font:13px/1.8 Consolas,monospace}.diagram{background:white;border:1px solid var(--line);border-radius:6px;padding:24px 12px 14px;margin:18px 0 24px;overflow:auto}.diagram svg{display:block;margin:auto;width:100%;height:auto;min-width:620px}.diagram-tools{display:flex;justify-content:flex-end;margin-bottom:8px;font-size:12px}.status{color:var(--muted);font-size:13px}.diagram:fullscreen{background:var(--paper);padding:30px;overflow:auto}.diagram:fullscreen svg{height:90vh;width:auto;max-width:none!important}footer{margin-top:36px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:4px}@media(max-width:640px){main{padding:22px 20px 40px}h1{font-size:30px}h2{font-size:21px}body{font-size:15px}th,td{padding:10px 8px}td:first-child{width:100px}.diagram{padding:16px 8px}.diagram:after{content:'Swipe sideways to see the full diagram.';display:block;font-size:11px;color:var(--muted);margin-top:12px}nav{font-size:11px}}@media print{main{padding:0;max-width:none}nav,footer,.diagram-tools{display:none}body{background:white;font-size:12px}h1{font-size:28px}h2{font-size:19px;margin-top:24px}.diagram{break-inside:avoid}.diagram svg{min-width:0}.diagram:after{display:none}pre{white-space:pre-wrap}tr{break-inside:avoid}}
</style>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
</head><body><main>
<nav><span>TEAM DISCUSSION</span><div><a href="/share/room-design-spec.md" download>Markdown source</a><button id="print">Print / PDF</button></div></nav>
<article id="content"><p class="status">Loading the spec…</p></article>
<footer>v0.0.0 · Draft for the team to change.</footer>
</main>
<script type="module">
document.getElementById('print').onclick=()=>window.print();
const content=document.getElementById('content');
try{
  const response=await fetch('/share/room-design-spec.md');
  if(!response.ok)throw new Error('Could not load the Markdown source.');
  const source=await response.text();
  const md=window.markdownit({html:false,linkify:true});
  const fence=md.renderer.rules.fence;
  md.renderer.rules.fence=(tokens,index,options,env,self)=>tokens[index].info==='mermaid'?`<section class="diagram" aria-label="Agent flow diagram"><div class="diagram-tools"><button class="expand">Expand diagram</button></div><div class="mermaid">${md.utils.escapeHtml(tokens[index].content)}</div></section>`:fence(tokens,index,options,env,self);
  content.innerHTML=md.render(source);
  document.querySelectorAll('.expand').forEach(button=>button.onclick=async()=>{const panel=button.closest('.diagram');if(document.fullscreenElement){await document.exitFullscreen();}else{await panel.requestFullscreen();}});
  try{
    const {default:mermaid}=await import('https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs');
    mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',themeVariables:{fontFamily:'Segoe UI, sans-serif',fontSize:'15px',primaryColor:'#eef2f7',primaryTextColor:'#252d36',primaryBorderColor:'#8d9fb5',lineColor:'#708397',secondaryColor:'#f4f1e8',tertiaryColor:'#edf3ef'},flowchart:{curve:'basis',nodeSpacing:30,rankSpacing:45,padding:16,htmlLabels:false}});
    await mermaid.run({querySelector:'.mermaid'});
  }catch(error){const message=document.createElement('p');message.className='status';message.textContent='Diagram could not render. The Mermaid source is shown above.';document.querySelector('.diagram').append(message);console.error(error);}
}catch(error){content.textContent='Could not load the spec. Use the Markdown source link above.';console.error(error);}
</script></body></html>
